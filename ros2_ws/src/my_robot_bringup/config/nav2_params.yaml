# FINAL CORRECTED nav2_params.yaml
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/home/rptech/AGX_Orin_Backup/rover_project/ros2_ws/src/my_robot_bringup/maps/my_room_map.yaml"

amcl:
  ros__parameters:
    use_sim_time: false
    # Odometry noise model. Lowered from 0.2 on 2026-09-08: /wheel_ticks now
    # carries REAL encoder counts with a measured cpr/radius/separation, so
    # odometry deserves more trust than the old open-loop dead reckoning did.
    # Too high and AMCL sprays particles every update and never settles.
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.15
    # Was 60. Express mode delivers ~476 valid points per scan, so AMCL was
    # throwing away roughly 87% of the available information -- the main reason
    # localisation was slow and unreliable. 300 costs little on an Orin.
    max_beams: 300
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.95
    # BOTH 0.0 -- adaptive recovery DISABLED, and deliberately so.
    #
    # These were briefly set to 0.1/0.001 to fix "AMCL loses the robot and stops
    # responding". That diagnosis was wrong: the real cause was the ESP32
    # dropping /cmd_vel (see TROUBLESHOOTING.md), and localisation was measuring
    # 91% scan-to-map match throughout -- it was never lost.
    #
    # With them enabled, AMCL injects random particles whenever the short-term
    # sensor likelihood dips below the long-term average. That is exactly how it
    # escapes a kidnapped-robot situation, and it is also how a perfectly well
    # localised robot suddenly TELEPORTS across the map mid-goal, which is what
    # was observed.
    #
    # For a booth rover that is placed by hand, given an initial pose, and never
    # picked up mid-run, the jumping is far worse than the inability to
    # self-recover. Nav2's own default is 0.0/0.0 for this reason. If the robot
    # genuinely gets lost, re-send an initial pose.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    # Was 0.2 rad / 0.25 m. At roughly 0.11-0.22 m/s that meant a filter update
    # only every 1-2 seconds, so convergence crawled. Updating more often is the
    # single biggest lever on how fast the pose locks on.
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan

behavior_server:
  ros__parameters:
    use_sim_time: false
    # Explicit config rather than nav2 defaults, so the collision checking and
    # speeds are visible and tunable.
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # "spin" MUST stay in this list even though booth_recovery.xml never uses
    # it. bt_navigator loads BOTH the navigate_to_pose tree AND the stock
    # navigate_through_poses tree, and the stock one calls <Spin>. Dropping the
    # plugin here made that tree fail to load, which aborted bt_navigator's
    # ACTIVATION entirely -- every other Nav2 node came up active, /goal_pose
    # was silently unsubscribed, and goals did nothing with no error anywhere
    # obvious. The server should offer every standard behaviour; whether a tree
    # uses one is the tree's business.
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    # 0.3, matching the controller. Odometry is ~4 Hz, so a tighter tolerance
    # just makes behaviours reject usable transforms.
    transform_tolerance: 0.3
    # 2.5 s. At the 0.10 m/s backup speed that projects 0.25 m, which is the
    # full backup distance, so the entire reverse path is collision-checked
    # against the local costmap before it commits. The lidar covers 360 deg, so
    # the rear IS sensed even though the camera faces forward. Raise this if
    # backup_speed is ever increased, or the check stops covering the move.
    simulate_ahead_time: 2.5
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Booth recovery tree: clear costmaps and WAIT, never spin or reverse.
    # See behavior_trees/booth_recovery.xml for why. The path is rewritten at
    # launch time by master_navigation.launch.py so it resolves inside the
    # installed share directory.
    default_nav_to_pose_bt_xml: "REPLACED_AT_LAUNCH"

controller_server:
  ros__parameters:
    use_sim_time: false

    # 10 Hz, not 20. Odometry arrives at ~3.9 Hz -- the Modbus link to the
    # RMCS-2303 drives is fixed at 9600 baud (manual: "9600 Baud, 8N1"), and two
    # encoder reads cost 70-200 ms, so 250 ms per update is the floor. Running
    # the controller 5x faster than its own feedback meant four of every five
    # cycles acted on a stale pose. Combined with DWB's aggressive alignment
    # critics that produced visible snaking down straight paths.
    controller_frequency: 10.0

    min_x_velocity_threshold:     0.001
    min_y_velocity_threshold:     0.5
    min_theta_velocity_threshold: 0.001
    # Seconds the controller may fail to produce a command before giving up
    # and handing over to a recovery. 0.3 s is less than one replanning cycle,
    # so a momentary block -- a person stepping across, a chair appearing at
    # the edge of the costmap -- went straight to a recovery dance instead of
    # waiting for the planner to route around it. 1.5 s spans three replans at
    # the new 2 Hz, which is enough for the ordinary case to resolve itself
    # without any theatre.
    failure_tolerance: 1.5

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins:   ["goal_checker"]
    controller_plugins:     ["FollowPath"]

    progress_checker:
      # PoseProgressChecker, not SimpleProgressChecker.
      #
      # SimpleProgressChecker counts ONLY translation. That breaks the final
      # approach: once the rover is inside the xy tolerance and merely turning
      # to the goal heading, it translates nothing, so after
      # movement_time_allowance the checker declares "stuck", fires a recovery,
      # and the behaviour tree restarts the whole navigate sequence. Observed:
      # the rover drove 2.2 m to within 0.14 m of a goal (inside the 0.20 m
      # tolerance) and then looped through 15 recoveries without ever
      # succeeding.
      #
      # PoseProgressChecker accepts ROTATION as progress too, so turning in
      # place -- during the final heading alignment, and during RotationShim's
      # turn at the start -- counts as making progress.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.3
      required_movement_angle: 0.5      # rad; turning this much counts
      # Down from 25. If the rover genuinely has not moved 0.3 m or turned
      # 0.5 rad in 15 s it is stuck, and spending another ten seconds proving
      # it just delays the recovery that would free it.
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance:  0.20
      yaw_goal_tolerance: 0.30
      stateful: True

    # ------------------------------------------------------------------
    # RotationShim wrapping RegulatedPurePursuit.
    #
    # Why not DWB: DWB samples trajectories and scores them with alignment
    # critics every cycle. With a 250 ms-stale pose it over-corrects, sees the
    # overshoot late, and over-corrects back -- the rover snaked down straight
    # paths. Pure pursuit is geometric: it steers toward a lookahead point on
    # the path, so a stale pose shifts the target slightly instead of inverting
    # the correction. Far more tolerant of low-rate feedback.
    #
    # RotationShim handles the start of a path: if the path heads off more than
    # angular_dist_threshold from where the robot faces, it rotates in place
    # first, then hands over. Without it the follower tries to turn and drive at
    # once from a standstill, which on a diff drive is its own source of weaving.
    # ------------------------------------------------------------------
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.55        # rad (~32 deg) before rotating in place
      forward_sampling_distance: 0.5
      # (rotate_to_heading_angular_vel and max_angular_accel were also set
      # here; both are set again further down in this same block, and YAML
      # keeps the last. They were dead text that read like live tuning.)
      simulate_ahead_time: 1.0

      # --- RegulatedPurePursuit ---
      desired_linear_vel: 0.22
      # Lookahead is THE smoothness knob for pure pursuit, and the reason is
      # geometric: steering curvature is computed from the angle to the
      # lookahead point, so the closer that point is, the more a small pose
      # error swings the steering command. Odometry here is ~4 Hz and AMCL
      # nudges the map->odom correction every 0.1 m, so there is always a few
      # centimetres of pose noise; at 0.6 m that noise was still producing
      # visible weave on straights.
      # 0.85 m roughly halves the steering sensitivity to the same noise. The
      # cost is slightly wider corner cutting, which matters little in a room
      # this size.
      lookahead_dist: 0.85
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.2
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true

      # Slow down for tight curves and near obstacles rather than trying to
      # corner at full speed -- this rover has no suspension and its odometry
      # degrades most during fast turns.
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.10
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.5
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      rotate_to_heading_angular_vel: 0.55
      # 0.7, down from 1.0. Caps how fast the steering command may change, so a
      # momentary curvature spike from pose noise cannot become a visible jerk.
      max_angular_accel: 0.7

      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5

      # 0.3, not 0.1. Odometry is ~4 Hz, so a TF lookup can legitimately be a
      # quarter-second behind; a tight tolerance just makes the controller
      # discard good data.
      transform_tolerance: 0.3

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      # SmacPlanner2D, not NavFn. NavFn's Dijkstra expansion returns a path that
      # steps along grid-cell boundaries, so it zigzags -- and the controller
      # faithfully follows the zigzag, which reads as snaking even when the
      # controller itself is behaving. Smac2D applies a smoothing pass, so the
      # path it hands over is already close to drivable.
      # No stock behaviour tree calls SmoothPath, so using a planner that
      # smooths internally avoids having to fork the BT.
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

local_costmap:
  local_costmap:
    ros__parameters:
      # The controller runs at 10 Hz. At 5 Hz this handed it obstacle data up
      # to 200 ms old, so the rover reacted a fifth of a second late to anything
      # that appeared -- hesitation and stop-start motion. 10 Hz means the
      # costmap is never staler than one controller tick.
      #
      # This does NOT touch controller_frequency, which stays at 10: that sets
      # the /cmd_vel rate, and flooding the ESP32 starves its micro-ROS
      # transport. That failure looked exactly like "Nav2 is broken" for hours.
      # A 60x60 cell rolling window costs nothing to update faster.
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Circular footprint, radius 0.33 m, set deliberately.
      #
      # The rover is physically 44 x 49 cm (deck plus wheels), so a polygon
      # would let it through 52 cm gaps while driving straight but need 70 cm to
      # rotate in place. A 0.32 m circle needs 64 cm in EVERY direction: tighter
      # than the polygon for turning, looser than it for straights.
      #
      # The circle is chosen for predictability -- one number, same clearance at
      # any heading, no orientation-dependent surprises when the rover pivots
      # beside a booth table. Sized just under the deck's own circumscribed
      # radius of 0.311 m plus wheels, so it is a true representation of the
      # space the rover sweeps while turning.
      #
      # This does NOT cover the screen overhanging the front. If the screen
      # reaches further than 0.32 m from the chassis centre, raise this to match
      # -- it sits at head height and is the part most likely to strike a person
      # or a booth surface.
      robot_radius: 0.33
      # No static_layer here, matching nav2's own default for a rolling local
      # costmap. Having it caused two distinct failures:
      #
      # 1. It needs map->odom every update cycle. Before the initial pose is
      #    set AMCL publishes no such transform, StaticLayer throws
      #    'map passed to lookupTransform does not exist', and the WHOLE
      #    costmap update aborts -- so the obstacle and voxel layers never run
      #    and the costmap publishes nothing at all. Measured: one message in
      #    15 seconds, entirely zero, while the lidar was returning obstacles
      #    at 0.41 m. The controller was working from an empty world.
      #
      # 2. Once localised it copies the surveyed map into the local window, so
      #    the controller refuses space the map calls occupied even when the
      #    lidar can see it is clear right now. On a map that is 85% unsurveyed
      #    with imperfect walls that reads as "there is obviously room and it
      #    will not go".
      #
      # The global costmap keeps its static_layer: planning is what the map is
      # for. The controller reacts to what the sensors see NOW.
      plugins: ["obstacle_layer", "voxel_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # The rover's own rear corner bumpers return at 0.42-0.45 m. SLAM
          # already ignores them via min_laser_range in slam_params.yaml, but
          # that parameter does NOT apply here -- the costmap consumes the raw
          # /scan. Without this the costmap marks the bumpers as obstacles that
          # travel with the robot and inflates them over its own footprint,
          # which measured as cost 81 under the robot and 76% of the area
          # within 2 m blocked. The controller then crawls and constantly
          # replans because it believes it is boxed in.
          # Proper fix: raise the lidar ~5 cm to clear the bumpers, then drop
          # this back to ~0.20 for genuine close-range detection.
          # 0.15 = see obstacles right up to the footprint. This was briefly
          # set to 0.55 to suppress what were believed to be self-hits from the
          # rover's corner bumpers. That diagnosis was WRONG -- a later stationary
          # sweep found 0.0% of returns under 0.6 m in every sector, so those
          # earlier close returns were furniture the rover was parked beside, not
          # its own structure. At 0.55 the rover drove into a 30 cm box it could
          # not see, having only 24 cm of margin beyond its 31 cm footprint.
          # Before ever raising this again, prove the returns move WITH the robot:
          #   python3 tools/check_lidar.py     (look for sectors under 0.6 m)
          # and re-check from a second, different parking spot.
          obstacle_min_range: 0.15
          raytrace_min_range: 0.0
      # ---------------------------------------------------------------
      # D455 depth -> VoxelLayer. LOCAL costmap only.
      #
      # Why a VoxelLayer rather than another source on obstacle_layer:
      # ObstacleLayer raytraces in 2D. The camera sits at 0.82 m, so a ray to a
      # point 3 m away passes OVER a low box at 1 m, and in 2D projection that
      # CLEARS the very cell the lidar just marked. A VoxelLayer keeps a 3D grid
      # and clears in 3D, so rays passing above a low obstacle leave it intact.
      # Getting this wrong silently deletes near-field obstacles -- the
      # dangerous direction to fail in.
      #
      # Why local only: the camera's contribution is transient and its blind
      # zones are large (it cannot see the floor within ~1.5 m -- see the
      # geometry note in realsense.launch.py). The global costmap plans against
      # the surveyed map; the controller reacts to what the camera sees now.
      #
      # Height band, in the global frame (base_link is at floor level):
      #   0.10  ignore the floor plane and its noise
      #   1.20  just above the rover's tallest point (~0.9 m mast/screen/camera).
      #         Nothing higher can collide, and marking ceiling lights or
      #         hanging signage would only box the robot in.
      # Range band matches the optics: Min-Z ~0.52 m, and depth beyond ~4 m is
      # too noisy to trust for marking.
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.10
        z_voxels: 16
        max_obstacle_height: 1.60
        mark_threshold: 1
        combination_method: 1
        observation_sources: pointcloud
        pointcloud:
          topic: /camera/camera/depth/color/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.10
          max_obstacle_height: 1.20
          obstacle_min_range: 0.60
          obstacle_max_range: 4.0
          raytrace_min_range: 0.60
          raytrace_max_range: 4.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 0.35. NOTE this is measured FROM THE OBSTACLE and INCLUDES the robot
        # radius -- it is not added on top of it. So the band around a wall is
        # 0.35 m total, of which 0.33 m is the rover's own body (its centre
        # cannot be there because it would be inside the wall) and only the last
        # 2 cm is soft, discouraging cost.
        # Kept deliberately tight: a large inflation on top of the radius makes
        # the planner refuse gaps the rover physically clears. The requirement
        # is that wherever the body fits, the rover goes.
        inflation_radius: 0.35

global_costmap:
  global_costmap:
    ros__parameters:
      # 1 Hz meant a new obstacle took up to a second to reach the planner, and
      # the plan another second to change. At 0.22 m/s that is nearly half a
      # metre of travel spent committed to a path that is already wrong.
      update_frequency: 3.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      # Without this the costmap initialises every cell to FREE, so the 82% of
      # the grid that is unsurveyed padding around the room looked like open
      # floor and the planner happily routed through it. Measured before the
      # fix: 0.0% of the global costmap was 'unknown'.
      track_unknown_space: true
      # Circular footprint, radius 0.33 m, set deliberately.
      #
      # The rover is physically 44 x 49 cm (deck plus wheels), so a polygon
      # would let it through 52 cm gaps while driving straight but need 70 cm to
      # rotate in place. A 0.32 m circle needs 64 cm in EVERY direction: tighter
      # than the polygon for turning, looser than it for straights.
      #
      # The circle is chosen for predictability -- one number, same clearance at
      # any heading, no orientation-dependent surprises when the rover pivots
      # beside a booth table. Sized just under the deck's own circumscribed
      # radius of 0.311 m plus wheels, so it is a true representation of the
      # space the rover sweeps while turning.
      #
      # This does NOT cover the screen overhanging the front. If the screen
      # reaches further than 0.32 m from the chassis centre, raise this to match
      # -- it sits at head height and is the part most likely to strike a person
      # or a booth surface.
      robot_radius: 0.33
      resolution: 0.05
      # The camera belongs HERE as much as in the local costmap. Without it
      # the planner is blind to anything the lidar's single 24 cm plane misses
      # -- an office chair, most obviously -- so it routes a path straight
      # through one, the controller meets it, fails, a recovery fires, and then
      # it replans THE SAME PATH THROUGH THE SAME CHAIR. That loop is what made
      # the rover feel sluggish: it was not avoiding obstacles at all, it was
      # repeatedly discovering them at the last moment.
      #
      # Cost: a person who walks past leaves a mark until the camera looks that
      # way again and raytraces it clear. The rover revisits the same ground at
      # an expo so it self-heals, and the first recovery action still clears
      # both costmaps outright.
      plugins: ["static_layer", "obstacle_layer", "voxel_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # The rover's own rear corner bumpers return at 0.42-0.45 m. SLAM
          # already ignores them via min_laser_range in slam_params.yaml, but
          # that parameter does NOT apply here -- the costmap consumes the raw
          # /scan. Without this the costmap marks the bumpers as obstacles that
          # travel with the robot and inflates them over its own footprint,
          # which measured as cost 81 under the robot and 76% of the area
          # within 2 m blocked. The controller then crawls and constantly
          # replans because it believes it is boxed in.
          # Proper fix: raise the lidar ~5 cm to clear the bumpers, then drop
          # this back to ~0.20 for genuine close-range detection.
          # 0.15 = see obstacles right up to the footprint. This was briefly
          # set to 0.55 to suppress what were believed to be self-hits from the
          # rover's corner bumpers. That diagnosis was WRONG -- a later stationary
          # sweep found 0.0% of returns under 0.6 m in every sector, so those
          # earlier close returns were furniture the rover was parked beside, not
          # its own structure. At 0.55 the rover drove into a 30 cm box it could
          # not see, having only 24 cm of margin beyond its 31 cm footprint.
          # Before ever raising this again, prove the returns move WITH the robot:
          #   python3 tools/check_lidar.py     (look for sectors under 0.6 m)
          # and re-check from a second, different parking spot.
          obstacle_min_range: 0.15
          raytrace_min_range: 0.0
        # Reversed 2026-09-15: the D455 IS now a source here too (see the
        # voxel_layer added below). Keeping it out was the direct cause of the
        # "sluggish, stuttery" recoveries reported at the expo -- the GLOBAL
        # planner, blind to anything the lidar's single 24 cm plane misses,
        # routed a path straight through a chair every time, the controller
        # met it, failed, a recovery fired, and the very next replan sent it
        # through the same chair again. Depth false positives are a real cost
        # (a person who walks past leaves a mark until the camera re-clears
        # it), but a planner that cannot see what it is driving into is worse.
      static_layer:
        # This 'plugin' key was MISSING since the very first commit of this
        # file -- the local costmap's static_layer had it, this one never did.
        # nav2_costmap_2d treats a missing plugin type as FATAL and the
        # container dies (SIGSEGV on the way down). It happened to go unnoticed
        # because -- as far as can be told -- this exact code path is a race:
        # sometimes the container comes up before hitting it, sometimes not.
        # Found 2026-09-15 chasing a genuine crash. Do not remove.
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      # Same band and source as the local costmap's copy, so both agree about
      # what counts as an obstacle. Longer raytrace range than the local one:
      # this map is not a 3 m rolling window, so it has to be able to clear a
      # mark left behind several metres back.
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.10
        z_voxels: 16
        max_obstacle_height: 1.60
        mark_threshold: 1
        combination_method: 1
        observation_sources: pointcloud
        pointcloud:
          topic: /camera/camera/depth/color/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.10
          max_obstacle_height: 1.20
          obstacle_min_range: 0.45
          obstacle_max_range: 4.0
          raytrace_min_range: 0.45
          raytrace_max_range: 5.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 0.35. NOTE this is measured FROM THE OBSTACLE and INCLUDES the robot
        # radius -- it is not added on top of it. So the band around a wall is
        # 0.35 m total, of which 0.33 m is the rover's own body (its centre
        # cannot be there because it would be inside the wall) and only the last
        # 2 cm is soft, discouraging cost.
        # Kept deliberately tight: a large inflation on top of the radius makes
        # the planner refuse gaps the rover physically clears. The requirement
        # is that wherever the body fits, the rover goes.
        inflation_radius: 0.35
