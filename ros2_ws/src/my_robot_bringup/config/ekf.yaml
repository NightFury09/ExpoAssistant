ekf_filter_node:
  ros__parameters:
    frequency: 20.0

    odom0: /odom
    odom0_config: [true, true, false, false, false, true,
                   false, false, false, false, false, false,
                   false, false, false]

    odom0_differential: True
    odom0_relative: false

    odom_frame: odom
    # EKF owns odom->base_footprint. The URDF then chains base_footprint->base_link,
    # and AMCL provides map->odom. rover_odometry runs with publish_tf:=false so it
    # does not also publish odom->base_footprint (which would give base_footprint
    # two parents). Single, clean TF chain for Nav2.
    base_link_frame: base_footprint
    world_frame: odom
